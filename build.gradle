plugins {
    id "java"
    id "org.springframework.boot" version "4.1.1"
    id "io.spring.dependency-management" version "1.1.7"
    id "org.openapi.generator" version "7.25.0"
}

group = "com.gryphlabs"
version = "0.0.1-SNAPSHOT"
description = "phoenix-api"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-webmvc"
    developmentOnly "org.springframework.boot:spring-boot-devtools"
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"

    runtimeOnly "io.micrometer:micrometer-registry-prometheus"

    compileOnly "org.projectlombok:lombok"
    annotationProcessor "org.projectlombok:lombok"

    implementation "com.fasterxml.jackson.core:jackson-databind"

    testImplementation "org.springframework.boot:spring-boot-starter-actuator-test"
    testImplementation "org.springframework.boot:spring-boot-starter-validation-test"
    testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"

    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    testCompileOnly "org.projectlombok:lombok"
    testAnnotationProcessor "org.projectlombok:lombok"
}

openApiGenerate {
    generatorName = 'spring'
    inputSpec = "$rootDir/src/main/resources/spec/phoenix-api-spec.yaml"
    outputDir = layout.buildDirectory.dir("generated/openapi").get().asFile.absolutePath

    apiPackage = 'com.gryphlabs.phoenix.api.generated.api'
    modelPackage = 'com.gryphlabs.phoenix.api.generated.model'

    configOptions = [
            delegatePattern      : 'true',
            interfaceOnly        : 'false',
            useSpringBoot4       : 'true',
            useJakartaEe         : 'true',
            useTags              : 'true',
            openApiNullable      : 'false',
            documentationProvider: 'none',
            annotationLibrary    : 'none'
    ]
}

sourceSets {
    main {
        java {
            srcDir layout.buildDirectory.dir("generated/openapi/src/main/java")
        }
    }
}

processResources {
    filesMatching('application.yaml') {
        expand(projectVersion: project.version)
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('openApiGenerate')
}

tasks.named("test") {
    useJUnitPlatform()
}
