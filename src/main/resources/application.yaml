spring:
  application:
    name: phoenix-api

  data:
    redis:
      host: ${PHOENIX_REDIS_HOST:localhost}
      port: ${PHOENIX_REDIS_PORT:6379}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${PHOENIX_MAIL_USERNAME}
    password: ${PHOENIX_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  version: @projectVersion@

  security:
    jwt:
      secret: ${PHOENIX_JWT_SECRET}
      access-token-expiration: 15m
      service-access-token-expiration: 1h
      refresh-token-expiration: 7d
      remember-me-refresh-token-expiration: 30d
    password:
      encoder:
        strength: 13
      min-length: 12
      uppercase: 1
      lowercase: 1
      numbers: 1
      special: 1
      special-characters: "!@#$%^&*()_+-=[]{}"
    registration:
      verification-token-expiration: 24h
      verification-url: http://localhost:8081/auth/register/confirm?token={token}
    caller-authorization:
      cache-ttl: 5m

server:
  port: 8081
