spring:
  datasource:
    url: jdbc:h2:mem:phoenix
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  security:
    password:
      min-length: 4
      uppercase: 0
      lowercase: 1
      numbers: 0
      special: 0
      special-characters: "!@#$%^&*()_+-=[]{}"